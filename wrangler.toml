name = "customs-agent"
main = "src/workers/index.ts"
compatibility_date = "2026-05-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ─── D1 (relational database) ───
[[d1_databases]]
binding = "DB"
database_name = "customs-agent-db"
database_id = "REPLACE_WITH_D1_ID_AFTER_CREATE"

# ─── R2 (object storage) ───
[[r2_buckets]]
binding = "DOCS"
bucket_name = "customs-agent-docs"

[[r2_buckets]]
binding = "REFERENCE"
bucket_name = "customs-agent-reference"  # HTS schedule, CROSS rulings cache

# ─── Vectorize (embeddings) ───
[[vectorize]]
binding = "HTS_INDEX"
index_name = "hts-schedule"

[[vectorize]]
binding = "CROSS_INDEX"
index_name = "cbp-cross-rulings"

# ─── KV (caching) ───
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID_AFTER_CREATE"

# ─── Queues ───
[[queues.producers]]
binding = "CLASSIFICATION_QUEUE"
queue = "classification-jobs"

[[queues.consumers]]
queue = "classification-jobs"
max_batch_size = 10
max_batch_timeout = 30

# ─── Durable Objects ───
[[durable_objects.bindings]]
name = "SHIPMENT_SESSION"
class_name = "ShipmentSession"

[[migrations]]
tag = "v1"
new_classes = ["ShipmentSession"]

# ─── Workers AI (cheap embeddings/OCR) ───
[ai]
binding = "AI"

# ─── Browser Rendering (gov portal scraping) ───
[browser]
binding = "BROWSER"

# ─── Workflows ───
[[workflows]]
name = "shipment-lifecycle"
binding = "SHIPMENT_WORKFLOW"
class_name = "ShipmentLifecycleWorkflow"

# ─── Secrets (set via `wrangler secret put`) ───
# ANTHROPIC_API_KEY
# CBP_CROSS_API_KEY (if/when we get one; otherwise scrape via Browser Rendering)

[vars]
ENVIRONMENT = "development"
DEFAULT_MODEL = "claude-sonnet-4-5"
CHEAP_MODEL = "claude-haiku-4-5-20251001"
HARD_MODEL = "claude-opus-4-7"
